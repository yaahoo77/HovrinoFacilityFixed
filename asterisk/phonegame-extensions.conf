[phonegame-phone]
exten => 7000,1,Answer()
 same => n,System(/usr/local/bin/phonegame-call start)
 same => n,Playback(beep)
 same => n,Hangup()
exten => _X.,1,Hangup(21)

[phonegame]
exten => sms,1,Set(CHANNEL(hangup_handler_push)=phonegame-after,s,1(sms))
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/sms)
 same => n,Set(PG_HEARD=1)
 same => n,Hangup()

exten => szyfr,1,Set(CHANNEL(hangup_handler_push)=phonegame-after,s,1(szyfr))
 same => n,Set(TIMEOUT(absolute)=900)
 same => n,Answer()
 same => n,Set(PG_HEARD=1)
 same => n,System(touch /var/lib/phonegame/clue-heard)
 same => n,Wait(1)
 same => n(again),Playback(custom/szyfr)
 same => n,Wait(2)
 same => n,Goto(again)

exten => documentation,1,Set(TIMEOUT(absolute)=900)
 same => n,Answer()
 same => n,Wait(1)
 same => n(again),Playback(custom/documentation)
 same => n,Wait(2)
 same => n,Goto(again)

exten => ending,1,Set(CHANNEL(hangup_handler_push)=phonegame-after,s,1(ending))
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/ngagagagaga)
 same => n,Set(PG_TRIES=0)
 same => n(menu),Set(PG_TRIES=$[${PG_TRIES} + 1])
 same => n,Read(PG_CHOICE,custom/ending_menu,1,,1,8)
 same => n,GotoIf($["${PG_CHOICE}" = "1"]?happy)
 same => n,GotoIf($["${PG_CHOICE}" = "2"]?bad)
 same => n,GotoIf($[${PG_TRIES} < 3]?menu)
 same => n,Hangup()
 same => n(happy),Set(PG_HEARD=1)
 same => n,System(echo happy > /var/lib/phonegame/ending-choice)
 same => n,Playback(custom/happy_ending)
 same => n,Playback(custom/outro)
 same => n,Hangup()
 same => n(bad),Set(PG_HEARD=1)
 same => n,System(echo bad > /var/lib/phonegame/ending-choice)
 same => n,Playback(custom/bad_ending)
 same => n,Playback(custom/outro)
 same => n,Hangup()

exten => failed,1,System(/usr/local/bin/phonegame-call after ${PG_MSG} missed)
 same => n,Hangup()

[phonegame-after]
exten => s,1,System(/usr/local/bin/phonegame-call after ${ARG1} ${IF($["${PG_HEARD}" = "1"]?heard:missed)})
 same => n,Return()
